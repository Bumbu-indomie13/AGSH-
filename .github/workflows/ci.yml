name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test suite
        run: python3 tests.py
      - name: Run feature test files (auth-env, record/replay, plan-redact, audit-all, relational filter)
        run: |
          for t in test_auditall test_authenv test_planredact test_recordreplay test_relational_filter tests_llm; do
            echo "== $t =="; python3 $t.py
          done
          echo "== tests/test_patch3 =="; python3 -m unittest discover -s tests -v 2>&1 | tail -3
      - name: Run examples end-to-end
        run: bash examples/run-tests.sh
